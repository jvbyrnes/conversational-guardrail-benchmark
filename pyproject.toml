[project]
name = "conversational-guardrail-benchmark"
version = "0.1.0"
description = "Reproducible conversational guardrail benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.8", "pyyaml>=6.0"]

[project.optional-dependencies]
dataset = ["datasets>=3.0"]
jev = ["typesafe-sdk>=0.1"]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "types-pyyaml>=6.0"]

[project.scripts]
guardrail-bench = "guardrail_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark/src/guardrail_bench"]

[tool.pytest.ini_options]
testpaths = ["benchmark/tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["guardrail_bench"]
mypy_path = "benchmark/src"
